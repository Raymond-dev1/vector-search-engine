[project]
name = "vector-search-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raymond Iziogba", email = "iziogbaraymond72@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
]

[project.scripts]
vector-search-engine = "vector_search_engine:main"
playground = "vector_search_engine.playground:main"
main = "vector_search_engine.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
